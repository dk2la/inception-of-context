services:
  ioc:
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock

  calculator:
    image: python:3.12-slim
    profiles: ["demo"]
    working_dir: /workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /workspace
    volumes:
      - ./target:/workspace:ro
      - ./bonus/demo/calculator_job.py:/demo/job.py:ro
    command: ["python", "/demo/job.py"]
