services:
  ioc:
    build: .
    command: uvicorn bonus.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./target:/workspace
      - chroma_data:/data/chroma
    environment:
      TARGET_DIR: /workspace
      CHROMA_DIR: /data/chroma
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      WATCH_POLLING: ${WATCH_POLLING:-0}
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_models:
