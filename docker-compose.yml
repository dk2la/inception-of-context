name: ioc

services:
  ioc:
    build: .
    image: ioc-architect:local
    command: ["python", "p1/index.py", "/workspace", "--serve"]
    user: "${IOC_UID:-1000}:${IOC_GID:-1000}"
    ports:
      - "${IOC_PORT:-8000}:8000"
    environment:
      IOC_TARGET: /workspace
      IOC_CHROMA_PATH: /data/chroma          # outside the target: the watcher never sees its own writes
      IOC_EMBED_CACHE: /data/models          # all-MiniLM-L6-v2 is downloaded here once, then used offline
      IOC_WATCH_MODE: polling                # inotify is unreliable on bind mounts (btrfs/overlay)
    volumes:
      - ${IOC_TARGET_DIR:-./demo}:/workspace
      - ioc-data:/data
    restart: unless-stopped

volumes:
  ioc-data:
