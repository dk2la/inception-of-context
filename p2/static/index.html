<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inception-of-Context</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 16px; color: #222; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  nav { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid #ddd; }
  nav button { padding: 8px 14px; border: 0; border-bottom: 3px solid transparent; background: none; }
  nav button.active { border-bottom-color: #2563eb; font-weight: bold; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; vertical-align: top; }
  pre { margin: 0; padding: 8px; overflow-x: auto; background: #f6f6f6; }
  #error { margin-bottom: 12px; padding: 8px; color: #b00020; background: #fdecea; white-space: pre-line; }
  #error:empty { display: none; }
  #status-cards { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .card { min-width: 150px; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; }
  .card small { display: block; color: #666; }
  .card strong { overflow-wrap: anywhere; }
  #file-counts th:last-child, #file-counts td:last-child { text-align: right; }
  #file-counts .total { font-weight: bold; }
  .changed, .highlight { background: #fff3b0; }
  #activity { max-height: 18em; margin: 0; padding: 4px 8px; overflow-y: auto; list-style: none; border: 1px solid #ccc; font-family: monospace; white-space: pre; }
  #activity .deleted { color: #b00020; }
  .split { display: flex; gap: 16px; align-items: flex-start; }
  #file-list { display: flex; flex-direction: column; gap: 2px; min-width: 200px; }
  #file-list button { text-align: left; }
  #file-view { flex: 1; min-width: 0; }
  #chunk-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  #file-content { max-height: 70vh; overflow: auto; padding: 0; font-family: monospace; }
  .line { width: max-content; min-width: 100%; }
  .number { display: inline-block; width: 3em; margin-right: 1em; text-align: right; color: #999; user-select: none; }
</style>
</head>
<body>
<h1>Inception-of-Context</h1>
<div id="error"></div>

<nav>
  <button data-tab="overview">Overview</button>
  <button data-tab="files">Files</button>
  <button data-tab="explorer">ChromaDB Explorer</button>
  <button data-tab="ask">Ask & Retrieve</button>
  <button data-tab="patch">Patch Loop</button>
</nav>

<section class="tab" id="tab-overview">
  <h2>Overview</h2>
  <div id="status-cards"></div>

  <h3>Chunks per file</h3>
  <table id="file-counts">
    <thead><tr><th>File</th><th>Chunks</th></tr></thead>
    <tbody></tbody>
  </table>

  <h3>Activity</h3>
  <ol id="activity"></ol>
</section>

<section class="tab" id="tab-files" hidden>
  <h2>Files</h2>
  <div class="split">
    <div id="file-list"></div>
    <div id="file-view">
      <div id="chunk-chips"></div>
      <pre id="file-content"></pre>
    </div>
  </div>
</section>

<section class="tab" id="tab-explorer" hidden>
  <h2>ChromaDB Explorer</h2>
</section>

<section class="tab" id="tab-ask" hidden>
  <h2>Ask & Retrieve</h2>
</section>

<section class="tab" id="tab-patch" hidden>
  <h2>Patch Loop</h2>
</section>

<script>
// ---------- Helpers ----------

// Calls the server and returns the JSON reply. A bad status throws an Error like "503 <detail>".
async function api(path, options) {
  const response = await fetch(path, options);
  if (response.ok) return response.json();
  const text = await response.text();
  let detail = text;
  try {
    detail = JSON.parse(text).detail; // FastAPI errors look like {"detail": "..."}
  } catch (e) {} // not JSON: keep the plain text
  throw new Error(response.status + " " + (typeof detail === "string" ? detail : text));
}

// Makes an element. The text is set with textContent, so it is always shown as plain text, never as HTML.
function el(tag, text = "", className = "") {
  const element = document.createElement(tag);
  element.textContent = text;
  element.className = className;
  return element;
}

// Each part of the page has its own error slot, so one part clearing its message never hides another's.
const errors = {};

function setError(name, message) {
  if (message) errors[name] = message;
  else delete errors[name];
  document.getElementById("error").textContent = Object.values(errors).join("\n");
}

// ---------- Tabs ----------

// Tab name -> function to run each time the tab is shown.
const tabLoaders = {files: loadFileList};

function showTab(name) {
  for (const section of document.querySelectorAll(".tab")) {
    section.hidden = section.id !== "tab-" + name;
  }
  for (const button of document.querySelectorAll("nav button")) {
    button.classList.toggle("active", button.dataset.tab === name);
  }
  location.hash = name;
  if (tabLoaders[name]) tabLoaders[name]();
}

// ---------- Overview ----------

// Draws one card per value of GET /status.
async function loadStatus() {
  try {
    const s = await api("/status");
    const cards = [
      ["Chunks", s.chunks],
      ["Target Project", s.target_dir],
      ["Index", s.chroma_dir],
      ["Answer model", s.answer_model],
      ["Patch model", s.patch_model],
      ["Ollama", s.ollama_host],
    ];
    const container = document.getElementById("status-cards");
    container.replaceChildren();
    for (const [label, value] of cards) {
      const card = el("div", "", "card");
      card.append(el("small", label), el("strong", value ?? "-"));
      container.append(card);
    }
    setError("status", "");
  } catch (e) {
    setError("status", "Cannot reach the server: " + e.message);
  }
}

// Builds a table row from a list of cell texts.
function row(texts, className = "") {
  const tr = el("tr", "", className);
  for (const text of texts) tr.append(el("td", text));
  return tr;
}

let lastCounts = null; // path -> Chunk count at the previous refresh; null before the first one

// Fills the "Chunks per file" table from GET /files. A row whose count changed since the last refresh is highlighted.
async function loadFiles() {
  try {
    const files = await api("/files");
    const tbody = document.querySelector("#file-counts tbody");
    tbody.replaceChildren();
    const counts = {};
    let total = 0;
    for (const file of files) {
      const changed = lastCounts !== null && lastCounts[file.path] !== file.chunks;
      tbody.append(row([file.path, file.chunks], changed ? "changed" : ""));
      counts[file.path] = file.chunks;
      total += file.chunks;
    }
    if (files.length === 0) {
      const empty = row(["The Index is empty."]);
      empty.firstChild.colSpan = 2;
      tbody.append(empty);
    } else {
      tbody.append(row(["Total", total], "total"));
    }
    lastCounts = counts;
    setError("file-counts", "");
  } catch (e) {
    setError("file-counts", "Cannot load Chunks per file: " + e.message);
  }
}

function refreshOverview() {
  loadStatus();
  loadFiles();
}

// One line of the activity feed, e.g. "12:03:15  indexed  calculator/core.py  (6 chunks)".
function formatEvent(event) {
  const time = new Date(event.time * 1000).toLocaleTimeString(); // event.time is in seconds
  return `${time}  ${event.type}  ${event.path}  (${event.chunks} chunks)`;
}

// Shows the Watcher's events as the server pushes them (GET /events), newest first.
function startActivityFeed() {
  const list = document.getElementById("activity");
  const source = new EventSource("/events");
  source.onopen = () => {
    list.replaceChildren(); // the server replays all its events on every (re)connect
    setError("feed", "");
  };
  source.onmessage = (message) => {
    const event = JSON.parse(message.data);
    list.prepend(el("li", formatEvent(event), event.type));
    if (list.children.length > 200) list.lastElementChild.remove();
  };
  source.onerror = () => setError("feed", "Live feed disconnected, reconnecting...");
}

// ---------- Files ----------

let selectedPath = null; // the file shown in the Files tab; kept when the user leaves and comes back

// Lists the indexed files as buttons, then reopens the file that was selected before.
async function loadFileList() {
  try {
    const files = await api("/files");
    const list = document.getElementById("file-list");
    list.replaceChildren();
    for (const file of files) {
      const button = el("button", file.path);
      button.onclick = () => showFile(file.path);
      list.append(button);
    }
    setError("file-list", "");
    if (selectedPath) showFile(selectedPath);
  } catch (e) {
    setError("file-list", "Cannot load the file list: " + e.message);
  }
}

// Shows one file line by line, with one chip per Chunk.
async function showFile(path) {
  try {
    const file = await api("/file?path=" + encodeURIComponent(path));
    selectedPath = path;
    const content = document.getElementById("file-content");
    content.replaceChildren();
    const lines = file.content.split("\n");
    if (lines[lines.length - 1] === "") lines.pop(); // the last newline does not start another line
    lines.forEach((text, index) => {
      const line = el("div", "", "line");
      line.append(el("span", index + 1, "number"), el("span", text));
      content.append(line);
    });
    const chips = document.getElementById("chunk-chips");
    chips.replaceChildren();
    for (const chunk of file.chunks) {
      const chip = el("button", `${chunk.name}  ${chunk.start_line}–${chunk.end_line}  ${chunk.kind}`);
      chip.onclick = () => highlightChunk(chunk);
      chips.append(chip);
    }
    setError("file", "");
  } catch (e) {
    setError("file", "Cannot load " + path + ": " + e.message);
  }
}

// Marks the lines of one Chunk. Line numbers start at 1 and the range includes both ends.
function highlightChunk(chunk) {
  const lines = document.querySelectorAll("#file-content .line");
  lines.forEach((line, index) => {
    const number = index + 1;
    line.classList.toggle("highlight", number >= chunk.start_line && number <= chunk.end_line);
  });
  lines[chunk.start_line - 1]?.scrollIntoView({block: "center"});
}

// ---------- Start ----------

for (const button of document.querySelectorAll("nav button")) {
  button.onclick = () => showTab(button.dataset.tab);
}
refreshOverview();
setInterval(refreshOverview, 3000);
startActivityFeed();
const firstTab = location.hash.slice(1);
showTab(document.getElementById("tab-" + firstTab) ? firstTab : "overview");
</script>
</body>
</html>
